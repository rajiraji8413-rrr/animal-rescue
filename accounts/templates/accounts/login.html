
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animal Rescue Login</title>
</head>
<body>
    <h1>Login</h1>

    {% if form.errors %}
        <p>Invalid username or password. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p>
        New user?
        <a href="{% url 'register' %}">Register here</a>
    </p>
</body>
