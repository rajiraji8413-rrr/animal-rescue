<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoption Request</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #286b4b;
            text-align: center;
        }

        .animal-name {
            text-align: center;
            font-size: 18px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 15px;
        }

        button {
            background: #286b4b;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d5037;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #286b4b;
            text-decoration: none;
        }

        .error {
            color: #b42318;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Adoption Request</h1>

        <p class="animal-name">
            You are applying to adopt <strong>{{ animal.name }}</strong>.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="{{ form.message.id_for_label }}">
                Why would you like to adopt this animal?
            </label>

            {{ form.message }}

            {% for error in form.message.errors %}
                <p class="error">{{ error }}</p>
            {% endfor %}

            <button type="submit">Submit Adoption Request</button>
        </form>

        <a class="back-link"
           href="{% url 'animal_detail' animal.id %}">
            Back to Animal Details
        </a>
    </div>
</body>
